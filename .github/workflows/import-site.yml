name: Import live site
on:
  push:
    branches: [import-site]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download files from momsthaifood.nl
        run: |
          set -u
          mkdir -p out/site
          fail=0
          while read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              index.html) url="/" ;;
              welkom3.html) echo "skip $f (redirect)"; continue ;;
              *.html) url="/${f%.html}" ;;
              *) url="/$f" ;;
            esac
            code=$(curl -sSL -A "MTF-import" -o "out/site/$f" -w "%{http_code}" "https://momsthaifood.nl$url")
            echo "$code $f"
            [ "$code" = "200" ] || fail=1
          done < files.txt
          printf '{"cleanUrls": true, "redirects": [{"source": "/dagmenu", "destination": "/menu", "permanent": true}, {"source": "/welkom3", "destination": "/actie", "permanent": false}, {"source": "/welkom3.html", "destination": "/actie", "permanent": false}, {"source": "/welkom10", "destination": "/actie", "permanent": false}, {"source": "/intro", "destination": "/", "permanent": false}]}' > out/site/vercel.json
          ls -la out/site | head -100
      - name: Commit to branch "site"
        run: |
          cd out
          git init -q -b site
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Kopie van live site (momsthaifood.nl) $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" site
