<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forum Cateringservice – Chinees Oosterse specialiteiten</title>
<meta name="description" content="Forum Cateringservice in Spijkenisse: Chinees Oosterse specialiteiten, bezorgd, afgehaald of als buffet op locatie.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/logo.png">
<link rel="apple-touch-icon" href="/forum/icon-180.png">
<link rel="preload" as="image" href="/forum/pand-vloot.jpg">
<script src="/site-config.js"></script>
<script src="/mtf-api.js"></script>
<script>
/* Binnen de site (bv. via 'Home' of het logo) direct naar de homepage, de intro alleen bij binnenkomst. */
(function(){var go=false;try{var r=document.referrer&&new URL(document.referrer);if(r&&r.host===location.host&&!/^\/(intro)?$/.test(r.pathname))go=true;}catch(e){}
if(go){location.replace('/home'+location.search);}else{document.write('<script src="/branch.js"><\/script><script src="/order-rules.js"><\/script>');}})();
</script>
<link rel="stylesheet" href="/theme.css">
<style>
:root{--gold:var(--mtf-gold);--ink:var(--mtf-cream);--red:var(--mtf-red);--ease:cubic-bezier(.22,.61,.2,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font-family:var(--mtf-font-body);overflow:hidden}
.stage{position:fixed;inset:0;overflow:hidden;background:#000}

/* Fotoreeks met langzame camerabeweging */
.reel{position:absolute;inset:0}
.shot{position:absolute;inset:0;opacity:0;transition:opacity 1.8s var(--ease)}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.18) translate(var(--fx,0),var(--fy,0));transition:transform 7.5s linear;filter:saturate(1.05) contrast(1.05)}
.shot.on{opacity:1}
.shot.on img{transform:scale(1.02) translate(var(--tx,0),var(--ty,0))}
.reel::after{content:"";position:absolute;inset:0;background:
 radial-gradient(ellipse at 50% 45%,rgba(0,0,0,.15) 0%,rgba(0,0,0,.55) 60%,rgba(0,0,0,.92) 100%),
 linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 60%,rgba(0,0,0,.75))}
.grain{position:absolute;inset:-50%;opacity:.07;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain 1.2s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}50%{transform:translate(-4%,3%)}100%{transform:translate(3%,-2%)}}

/* Filmbalken */
.bar{position:absolute;left:0;right:0;height:11vh;background:#000;z-index:3;transition:transform 1.6s var(--ease)}
.bar.top{top:0}.bar.bot{bottom:0}
.s4 .bar.top{transform:translateY(-100%)}.s4 .bar.bot{transform:translateY(100%)}

/* Bijschriften tijdens de reeks */
.cap{position:absolute;left:0;right:0;bottom:16vh;z-index:4;text-align:center;font-family:var(--mtf-font-heading);font-size:clamp(20px,4.4vw,34px);letter-spacing:.04em;color:var(--ink);text-shadow:0 2px 18px rgba(0,0,0,.8);opacity:0;transform:translateY(10px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.cap.on{opacity:1;transform:none}
.cap small{display:block;margin-top:6px;font-family:var(--mtf-font-body);font-size:clamp(11px,2.6vw,13px);letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}

/* Welkom in het Chinees */
.hello{position:absolute;inset:0;z-index:4;display:grid;place-content:center;justify-items:center;gap:14px;pointer-events:none;opacity:0;transition:opacity 1.2s var(--ease)}
.s1 .hello{opacity:1}.s2 .hello{opacity:0}
.hello .zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(54px,14vw,120px);color:var(--gold);letter-spacing:.12em;text-shadow:0 0 40px rgba(var(--mtf-gold-rgb),.35)}
.hello .line{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);transition:width 1.6s var(--ease) .4s}
.s1 .hello .line{width:min(320px,60vw)}
.hello .sub{font-size:clamp(12px,3vw,15px);letter-spacing:.42em;text-transform:uppercase;color:var(--ink)}

/* Titelscherm */
.main{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,2.6vh,22px);padding:24px;text-align:center}
.logo{width:min(560px,86vw);opacity:0;transform:scale(.9);filter:blur(10px);transition:opacity 1.4s var(--ease),transform 1.8s var(--ease),filter 1.6s var(--ease)}
.logo img{width:100%;display:block}
.s4 .logo{opacity:1;transform:none;filter:drop-shadow(0 0 30px rgba(var(--mtf-red-rgb),.35))}
.tag{margin:0;font-family:var(--mtf-font-heading);font-style:italic;font-size:clamp(18px,4vw,26px);color:var(--ink);opacity:0;transition:opacity 1.2s var(--ease) .3s}
.s4 .tag{opacity:1}
.status{display:inline-flex;align-items:center;gap:10px;max-width:min(560px,100%);padding:11px 18px;border-radius:999px;background:rgba(0,0,0,.55);border:1px solid rgba(var(--mtf-gold-rgb),.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:clamp(14px,3.6vw,16px);line-height:1.35;opacity:0;transform:translateY(14px);transition:opacity 1s var(--ease) .5s,transform 1s var(--ease) .5s}
.s4 .status{opacity:1;transform:none}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:#3ccf6a;box-shadow:0 0 0 0 rgba(60,207,106,.6);animation:pulse 2s infinite}
.dot.off{background:#d9a441;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(60,207,106,0)}100%{box-shadow:0 0 0 0 rgba(60,207,106,0)}}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;opacity:0;transform:translateY(14px);transition:opacity 1s var(--ease) .8s,transform 1s var(--ease) .8s}
.s4 .btns{opacity:1;transform:none}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:50px;padding:0 26px;border-radius:999px;font-weight:700;font-size:16px;text-decoration:none;transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .25s}
.btn svg{width:18px;height:18px}
.btn.primary{background:linear-gradient(180deg,#e11a24,var(--red));color:#fff;box-shadow:0 10px 28px rgba(var(--mtf-red-rgb),.45),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.primary:hover,.btn.primary:focus-visible{transform:translateY(-2px);box-shadow:0 14px 34px rgba(var(--mtf-red-rgb),.6)}
.btn.ghost{color:var(--ink);border:1px solid rgba(var(--mtf-gold-rgb),.55);background:rgba(0,0,0,.35)}
.btn.ghost:hover,.btn.ghost:focus-visible{background:rgba(var(--mtf-gold-rgb),.15)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.skip{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:6;background:rgba(0,0,0,.5);color:var(--ink);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:9px 16px;font-size:13px;cursor:pointer;transition:opacity .6s}
.s4 .skip{opacity:0;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.leaving .main{opacity:0;transition:opacity .5s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage">
 <div class="reel" id="reel" aria-hidden="true"></div>
 <div class="grain" aria-hidden="true"></div>
 <div class="bar top" aria-hidden="true"></div>
 <div class="bar bot" aria-hidden="true"></div>

 <div class="hello" aria-hidden="true">
  <span class="zh" lang="zh-Hant">歡迎</span>
  <span class="line"></span>
  <span class="sub">Welkom bij Forum</span>
 </div>
 <p class="cap" id="cap" aria-hidden="true"></p>

 <main class="main">
  <h1 class="sr">Forum Cateringservice – Chinees Oosterse specialiteiten in Spijkenisse</h1>
  <div class="logo"><img src="/forum/logo-wide.png" alt=""></div>
  <p class="tag">Chinees Oosterse specialiteiten, thuisbezorgd of als buffet</p>
  <p class="status" id="status" role="status" aria-live="polite"><span class="dot" id="dot"></span><span id="statusText">Even kijken of je vandaag kunt bestellen…</span></p>
  <nav class="btns" aria-label="Verder naar">
   <a class="btn primary" id="orderBtn" href="/menu">Bestel nu
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
   <a class="btn ghost" href="/catering-paketten">Catering &amp; buffet</a>
   <a class="btn ghost" id="homeBtn" href="/home">Home</a>
  </nav>
 </main>
 <button class="skip" id="skip" type="button">Overslaan</button>
</div>

<script>
(()=>{
 const st=document.getElementById('stage'),reel=document.getElementById('reel'),cap=document.getElementById('cap');
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 /* Shots: foto, bijschrift, camerabeweging (van → naar). */
 const shots=[
  ['/forum/pand-vloot.jpg','Kelvinweg 11, Spijkenisse','Onze keuken',['-3%','2%'],['2%','-1%']],
  ['/forum/gerecht-kip-cashew.jpg','Vers uit de wok','Kong po · Cantonese stijl',['2%','3%'],['-2%','-2%']],
  ['/forum/buffet.jpg','Uw buffet, wij verzorgen het','Catering op locatie',['0','-4%'],['0','3%']],
  ['/forum/bus-evenement.jpg','Wij rijden voor u uit','Bezorging in de regio',['3%','0'],['-3%','1%']],
  ['/forum/gerecht-bami-nasi.jpg','Bami, nasi of witte rijst','Bij elk hoofdgerecht',['-2%','-2%'],['2%','2%']]
 ];
 const els=shots.map(([src,,,f,t])=>{const d=document.createElement('div');d.className='shot';const i=new Image();i.src=src;i.alt='';i.decoding='async';
  i.style.setProperty('--fx',f[0]);i.style.setProperty('--fy',f[1]);i.style.setProperty('--tx',t[0]);i.style.setProperty('--ty',t[1]);d.append(i);reel.append(d);return d;});

 /* Locatie meenemen naar de volgende pagina */
 try{const loc=window.MTFLocation&&window.MTFLocation.slug;if(loc&&loc!==SITE_CONFIG.defaultLocation){for(const id of ['orderBtn','homeBtn']){const a=document.getElementById(id);a.href=a.getAttribute('href')+'?location='+encodeURIComponent(loc);}}}catch{}

 /* Volgorde: welkom → vier shots met bijschrift → titelscherm op de eerste foto. */
 let timers=[],done=false,cur=-1;
 const show=i=>{els.forEach((e,k)=>e.classList.toggle('on',k===i));cur=i;};
 const caption=i=>{cap.classList.remove('on');if(i<0)return;setTimeout(()=>{cap.innerHTML=shots[i][1]+'<small>'+shots[i][2]+'</small>';cap.classList.add('on');},350);};
 function finish(){if(done)return;done=true;timers.forEach(clearTimeout);caption(-1);st.classList.add('s1','s2','s4');show(0);loopReel();}
 let loopT;function loopReel(){clearInterval(loopT);if(reduce)return;loopT=setInterval(()=>show((cur+1)%els.length),7000);}
 if(reduce){finish();}else{
  const at=[[150,()=>st.classList.add('s1')],[2300,()=>{st.classList.add('s2');show(1);caption(1);}],
   [5200,()=>{show(2);caption(2);}],[8100,()=>{show(3);caption(3);}],[11000,()=>{show(4);caption(4);}],[13600,finish]];
  at.forEach(([t,f])=>timers.push(setTimeout(f,t)));
 }
 document.getElementById('skip').addEventListener('click',finish);
 addEventListener('keydown',e=>{if(!done&&(e.key==='Escape'||e.key===' '||e.key==='Enter'))finish();});

 /* Bestel nu: zachte overgang naar het menu */
 const orderBtn=document.getElementById('orderBtn');
 orderBtn.addEventListener('click',e=>{
  if(reduce||e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;
  e.preventDefault();finish();st.classList.add('leaving');
  try{sessionStorage.setItem('mtf_steam','1');}catch{}
  setTimeout(()=>{location.href=orderBtn.href;},450);
 });
 addEventListener('pageshow',e=>{if(e.persisted)st.classList.remove('leaving');});

 /* Bestelstatus voor vandaag */
 const R=window.MTFOrderRules,txt=document.getElementById('statusText'),dot=document.getElementById('dot');
 const dayName=d=>new Intl.DateTimeFormat('nl-NL',{weekday:'long',timeZone:'UTC'}).format(new Date(d+'T12:00:00Z'));
 const longDate=d=>new Intl.DateTimeFormat('nl-NL',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'}).format(new Date(d+'T12:00:00Z'));
 function nextLabel(today,next){
  if(!next)return '';
  const t=new Date(today+'T12:00:00Z');t.setUTCDate(t.getUTCDate()+1);
  if(next===t.toISOString().slice(0,10))return 'morgen ('+dayName(next)+')';
  const diff=(new Date(next+'T12:00:00Z')-new Date(today+'T12:00:00Z'))/864e5;
  return diff<7?dayName(next):longDate(next);
 }
 function render(){
  if(!R){txt.textContent='Bekijk het menu en bestel direct online.';return;}
  const c=R.clock(),today=c.date,open=R.opening(today),cut=R.cutoff(today)*60,closed=R.closedReason(today);
  if(open&&c.seconds<=cut){
   dot.className='dot';
   txt.innerHTML='Vandaag bestellen kan nog tot <b>'+R.formatTime(R.cutoff(today))+'</b>';
   return;
  }
  dot.className='dot off';
  const next=R.nextDate(),lbl=nextLabel(today,next);
  const why=(open&&!closed)?'Bestellen voor vandaag is gesloten':'Vandaag gesloten';
  txt.innerHTML=why+(lbl?' · bestel alvast voor <b>'+lbl+'</b>':'');
 }
 render();setInterval(render,30000);
 /* Uitzonderingsdagen en openingstijden uit de database */
 MTF.fetch(SITE_CONFIG.supabaseUrl+'/functions/v1/place-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'schedule'})})
  .then(r=>r.json()).then(d=>{if(d&&d.ok&&Array.isArray(d.closures)&&R){R.setClosures(d.closures);if(Array.isArray(d.hours))R.setHours(d.hours);render();}}).catch(()=>{});
})();
</script>
</body>
</html>
